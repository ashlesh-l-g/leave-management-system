spring.application.name=leave-management-system

# Server
server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL (local database, see README.md for setup)
# Values are read from environment variables and fall back to local defaults,
# so no secrets are hardcoded in this file.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leave_db}
spring.datasource.username=${DB_USERNAME:leave_user}
spring.datasource.password=${DB_PASSWORD:leave_password}

# Hibernate creates/updates the tables from the @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT (dev default secret; must be at least 32 characters - jjwt then picks
# HS256/HS384/HS512 based on the key length)
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-this-dev-secret-to-a-long-random-string-32bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
